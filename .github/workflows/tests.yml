name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python tests/run_ci.py
      - name: CLI smoke test
        shell: bash
        run: |
          python ibfix.py --help > /dev/null
          # no L4D2 on the runner, so locate exits 1 - but it must run and report, not crash
          out=$(python ibfix.py locate 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "Places searched" || { echo "::error::ibfix locate crashed"; exit 1; }
